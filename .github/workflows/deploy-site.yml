name: deploy-site

on:
  workflow_run:
    workflows: [ci, guards]
    types: [completed]

permissions:
  contents: read

# Entrambi i completamenti usano lo stesso gruppo, indipendente dal workflow origine.
concurrency:
  group: deploy-site-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      ready: ${{ steps.revision.outputs.ready }}
      branch: ${{ steps.revision.outputs.branch }}
      run-id: ${{ steps.revision.outputs.runId }}
      artifact-id: ${{ steps.revision.outputs.artifactId }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Disponibilità dei secret
        id: credentials
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT" ] || [ -z "$CF_TOKEN" ]; then
            echo 'Deploy saltato: configurare CLOUDFLARE_ACCOUNT_ID e CLOUDFLARE_API_TOKEN (solo Pages Edit).' | tee -a "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      # workflow_run usa la definizione su main: mai eseguire codice della PR con secret.
      - uses: actions/checkout@v7
        if: steps.credentials.outputs.ready == 'true'
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Verifica revisione, CI, guardie e artifact
        if: steps.credentials.outputs.ready == 'true'
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-site-gate.mjs

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      # Nessun checkout né npm ci: l'artifact è solo contenuto statico, mai codice eseguito.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.gate.outputs.artifact-id }}
          run-id: ${{ needs.gate.outputs.run-id }}
          github-token: ${{ github.token }}
          path: site/out
          merge-multiple: true
      - name: Verifica export esclusivamente statico
        run: |
          for entry in _worker.js functions _routes.json; do
            if [ -e "site/out/$entry" ] || [ -L "site/out/$entry" ]; then
              echo "Export non statico: site/out/$entry non è ammesso." >&2
              exit 1
            fi
          done
      - name: Pubblica su Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_BRANCH: ${{ needs.gate.outputs.branch }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler@4.141.0 pages deploy site/out --project-name cleverops --branch "$DEPLOY_BRANCH" --commit-hash "$DEPLOY_SHA"
